name: release-automation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  tag-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify distribution workflow is active
        # A release tag is not useful when the workflow that builds its
        # cross-platform artifacts is disabled. Fail before creating the tag,
        # rather than leaving users with a platform-incomplete release (#238).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/dist.yml" \
              --jq '.state'
          )"
          if [[ "$state" != "active" ]]; then
            echo "::error::dist.yml must be active before creating a release tag (state=$state)"
            exit 1
          fi

      - name: Read version from Cargo.toml
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ -z "$version" ]; then
            echo "::error::Unable to parse version from Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Read latest tag
        id: latest
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | head -1)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Create tag
        if: steps.latest.outputs.latest != format('v{0}', steps.version.outputs.version)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          echo "Creating release tag $tag"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
          # Push events created with GITHUB_TOKEN do not start other workflows.
          # workflow_dispatch is the documented exception, so start dist
          # explicitly against the immutable tag that contains its workflow.
          gh workflow run dist.yml --ref "$tag"

      - name: Skip (already tagged)
        if: steps.latest.outputs.latest == format('v{0}', steps.version.outputs.version)
        run: |
          echo "Latest tag matches Cargo.toml version; nothing to do."
